<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spielplan - Berlin Thunderbirds</title>
    <!-- FontAwesome für Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Verknüpfung zur zentralen style.css -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ==========================================
       HEADER & NAVIGATION
       ========================================== -->
    <div id="main-header"></div>

    <!-- ==========================================
       HERO-NAVIGATION (TEAM-SCHNELLSPRUNG)
       ========================================== -->
    <div class="hero-nav" id="tackle" style="margin-top: 88px; display: grid; grid-template-columns: repeat(4, 1fr); height: 35vh; width: 100%; border-bottom: 4px solid var(--thunder-blue);">
        <a href="#tackle" class="nav-item" style="position: relative; text-decoration: none; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,0.1);"><img src="Bilder/Tackle.webp" alt="Tackle Football" style="position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.6); transition: 0.6s;"><span style="position: relative; z-index: 2; font-size: 1.6rem; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 15px rgba(0,0,0,1); letter-spacing: 2px;">Tackle</span></a>
        <a href="#u10" class="nav-item" style="position: relative; text-decoration: none; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,0.1);"><img src="Bilder/U10.webp" alt="U10 Flag" style="position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.6); transition: 0.6s;"><span style="position: relative; z-index: 2; font-size: 1.6rem; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 15px rgba(0,0,0,1); letter-spacing: 2px;">U10 
		</span></a>
        <a href="#u13" class="nav-item" style="position: relative; text-decoration: none; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,0.1);"><img src="Bilder/U13.webp" alt="U13 Flag" style="position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.6); transition: 0.6s;"><span style="position: relative; z-index: 2; font-size: 1.6rem; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 15px rgba(0,0,0,1); letter-spacing: 2px;">U13 Flag</span></a>
        <a href="#u16" class="nav-item" style="position: relative; text-decoration: none; color: white; overflow: hidden; display: flex; justify-content: center; align-items: center; border-right: 1px solid rgba(255,255,255,0.1);"><img src="Bilder/U16.webp" alt="U16 Flag" style="position: absolute; width: 100%; height: 100%; object-fit: cover; filter: brightness(0.4) grayscale(0.6); transition: 0.6s;"><span style="position: relative; z-index: 2; font-size: 1.6rem; font-weight: bold; text-transform: uppercase; text-shadow: 2px 2px 15px rgba(0,0,0,1); letter-spacing: 2px;">U16 Flag</span></a>
    </div>

    <!-- ==========================================
       SPIELPLAN: TACKLE FOOTBALL
       ========================================== -->
    <section style="padding: 80px 20px; min-height: 80vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, var(--thunder-dark), var(--thunder-blue));">
        <div class="section-container" style="width: 100%; max-width: 1000px;">
            <h2 style="font-size: 2.8rem; text-transform: uppercase; margin-bottom: 40px; letter-spacing: 3px; text-align: center; color: var(--thunder-light);">Tackle Football</h2>
            <div class="spielplan-lade-zone"></div>
        </div>
    </section>

    <!-- ==========================================
       SPIELPLAN: U10 FLAG TURNIERE
       ========================================== -->
    <section id="u10" style="padding: 80px 20px; min-height: 80vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, var(--thunder-dark), #052c54);">
        <div class="section-container" style="width: 100%; max-width: 1000px;">
            <h2 style="font-size: 2.8rem; text-transform: uppercase; margin-bottom: 40px; letter-spacing: 3px; text-align: center; color: #60a5fa;">U10 Flag Turniere</h2>
            <div class="spielu10"></div>
        </div>
    </section>

    <!-- ==========================================
       SPIELPLAN: U13 FLAG TURNIERE
       ========================================== -->
    <section id="u13" style="padding: 80px 20px; min-height: 80vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, var(--thunder-dark), #2d5a27);">
        <div class="section-container" style="width: 100%; max-width: 1000px;">
            <h2 style="font-size: 2.8rem; text-transform: uppercase; margin-bottom: 40px; letter-spacing: 3px; text-align: center; color: #4ade80;">U13 Flag Turniere</h2>
            <div class="spielu13"></div>
        </div>
    </section>

    <!-- ==========================================
       SPIELPLAN: U16 FLAG TURNIERE
       ========================================== -->
    <section id="u16" style="padding: 80px 20px; min-height: 80vh; display: flex; flex-direction: column; align-items: center; background: linear-gradient(180deg, var(--thunder-dark), #8b0000);">
        <div class="section-container" style="width: 100%; max-width: 1000px;">
            <h2 style="font-size: 2.8rem; text-transform: uppercase; margin-bottom: 40px; letter-spacing: 3px; text-align: center; color: #f87171;">U16 Flag Turniere</h2>
            <div class="spielu16"></div>
        </div>
    </section>

    <!-- ==========================================
       FOOTER & EASTER EGG
       ========================================== -->
    <div id="main-footer"></div>

    <!-- ==========================================
       JAVASCRIPT (SPIELPLAN-LOGIK & MENÜ)
       ========================================== -->
    <script src="spielplan.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Mobile Menu Toggle
            const menuToggle = document.getElementById('mobile-menu');
            const nav = document.querySelector('nav');

            if (menuToggle && nav) {
                menuToggle.addEventListener('click', () => {
                    nav.classList.toggle('active');
                });
            }
        });
    </script>
	
	<script src="leisten.js"></script>
	
</body>
</html>
